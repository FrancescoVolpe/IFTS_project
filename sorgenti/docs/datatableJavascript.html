<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Params DataTable</title>

  <link
    rel="stylesheet"
    href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css"
  >

  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 24px;
    }

    table {
      width: 100%;
    }
  </style>
</head>

<body>
  <main>
    <h1>Lista Parametri</h1>

    <table id="paramsTable" class="display">
      <thead>
        <tr>
          <th>ID</th>
          <th>Key</th>
          <th>Value</th>
          <th>Description</th>
        </tr>
      </thead>

      <tbody></tbody>
    </table>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      loadParams();
    });

    async function loadParams() {
      try {
        const response = await fetch(
          "http://localhost:5678/webhook/v1/returnparams"
        );

        if (!response.ok) {
          throw new Error("Errore HTTP");
        }

        const data = await response.json();

        new DataTable("#paramsTable", {
          data: data,

          columns: [
            { data: "_id" },
            { data: "key" },
            { data: "value" },
            { data: "description" }
          ],

          order: [[1, "asc"]],

          pageLength: 10,

          responsive: true,

          language: {
            search: "Cerca:",
            lengthMenu: "Mostra _MENU_ elementi",
            info: "Mostrati _START_ - _END_ di _TOTAL_ elementi",
            zeroRecords: "Nessun dato trovato",

            paginate: {
              first: "Prima",
              last: "Ultima",
              next: "Avanti",
              previous: "Indietro"
            }
          }
        });

      } catch (error) {
        console.error(error);
        alert("Errore nel caricamento dei parametri");
      }
    }
  </script>
</body>
</html>
